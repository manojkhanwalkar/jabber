template: Hello, %s!
defaultName: Stranger

server:
  #  softNofileLimit: 1000
  #  hardNofileLimit: 1000
  applicationConnectors:
    - type: https
      port: 8280
      keyStorePath: ${JABBER_KEYSTORE_PATH:-/home/manoj/IdeaProjects/securitytest/src/main/resources/mytestkey.jks}
      keyStorePassword: ${JABBER_KEYSTORE_PASSWORD}
    #this requires the alpn-boot library on the JVM's boot classpath
    #- type: h2
    #  port: 8445
    #  keyStorePath: example.keystore
    #  keyStorePassword: example
  adminConnectors:
    - type: https
      # admin (metrics, healthcheck, tasks) is reachable only from this host
      bindHost: 127.0.0.1
      port: 8281
      keyStorePath: ${JABBER_KEYSTORE_PATH:-/home/manoj/IdeaProjects/securitytest/src/main/resources/mytestkey.jks}
      keyStorePassword: ${JABBER_KEYSTORE_PASSWORD}